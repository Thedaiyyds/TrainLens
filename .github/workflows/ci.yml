name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .